<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoTerrain</title><style>body{margin:0;background:#15231d;color:#eee;font:16px system-ui}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap}a{color:#8ce4ff}canvas{display:block;width:100%;height:70vh;touch-action:none}button,select{padding:10px}#hud{padding:12px}</style><header><a href="index.html">Vissza a CHRONOVERSE-be</a><select id="era"><option value="0">Kr. e. 9000</option><option value="1">1435</option><option value="2">1885</option><option value="3" selected>2032</option></select><button id="reset">Biztonságos kezdőpont</button></header><canvas id="view" width="800" height="450"></canvas><div id="hud"></div><header><button data-k="w">Előre</button><button data-k="s">Hátra</button><button data-k="a">Balra fordulás</button><button data-k="d">Jobbra fordulás</button></header><p>WASD vagy nyílbillentyűk. Korszakfüggő épületekkel bővített szintetikus 4 × 4 km-es terep, nem történelmi rekonstrukció. A fő játék mentését nem módosítja.</p><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),era=document.querySelector('#era'),hud=document.querySelector('#hud');let x=2000,y=2000,a=0,keys=new Set(),last=0;
function height(x,y){return 18+12*Math.sin(x/480)*Math.cos(y/620)+5*Math.sin((x+y)/180)}
function river(x,y){return Math.abs(x-900-180*Math.sin(y/550))<65}
function road(x,y){return +era.value>0&&Math.abs(y-2000)<18}
const structures=[{x:2080,y:2028,w:12,l:10,h:4,from:0,to:1,name:"Őskori kunyhó",wall:"#99734c",roof:"#695238"},{x:2080,y:2028,w:14,l:10,h:5,from:1,to:3,name:"Lakóház",wall:"#d4c3a1",roof:"#77513b"},{x:2120,y:1965,w:24,l:15,h:12,from:1,to:4,name:"Templom",wall:"#a8a398",roof:"#605b54"},{x:2160,y:2030,w:28,l:18,h:8,from:2,to:4,name:"Műhely",wall:"#a65f48",roof:"#504a45"},{x:2080,y:2028,w:18,l:14,h:9,from:3,to:4,name:"Modern ház",wall:"#d6d9d9",roof:"#424a50"}];function buildings(){let e=+era.value;return structures.filter(b=>e>=b.from&&e<b.to)}function buildingAt(x,y,pad=0){return buildings().find(b=>Math.abs(x-b.x)<b.w/2+pad&&Math.abs(y-b.y)<b.l/2+pad)}function surface(x,y){let b=buildingAt(x,y);if(!b)return height(x,y);return height(b.x,b.y)+b.h+Math.max(0,1-Math.abs(y-b.y)/(b.l/2))*2}
function safe(x,y){return x>20&&y>20&&x<3980&&y<3980&&!river(x,y)&&!buildingAt(x,y,1)}
function color(x,y){const b=buildingAt(x,y);if(b)return b.wall;if(river(x,y))return '#477f9e';if(road(x,y))return +era.value===3?'#666b70':'#b7a17b';let n=Math.sin(x/90)*Math.cos(y/110);return n>.25?(+era.value===0?'#355e38':'#517849'):n<-.4?'#a2a76b':'#77975b'}
function reset(){x=2000;y=2000;a=0}document.querySelector('#reset').onclick=reset;
const aliases={ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d'};addEventListener('keydown',e=>{let k=aliases[e.key]||e.key.toLowerCase();if('wasd'.includes(k)&&k.length===1){keys.add(k);e.preventDefault()}});addEventListener('keyup',e=>keys.delete(aliases[e.key]||e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.k)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.k)});
function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;a+=(Number(keys.has('d'))-Number(keys.has('a')))*1.6*dt;let step=(Number(keys.has('w'))-Number(keys.has('s')))*8*dt,nx=x+Math.cos(a)*step,ny=y+Math.sin(a)*step;if(safe(nx,ny)){x=nx;y=ny}const W=c.width,H=c.height;g.fillStyle='#9bc2d8';g.fillRect(0,0,W,H);let eye=height(x,y)+1.8;for(let col=0;col<W;col+=4){let angle=a+(col/W-.5)*1.15,top=H;for(let d=5;d<1800&&top>0;d+=Math.max(2,Math.min(6,d*.025))){let px=x+Math.cos(angle)*d,py=y+Math.sin(angle)*d;if(px<0||py<0||px>4000||py>4000)break;let z=H*.48+(eye-surface(px,py))*260/d;if(z<top){g.fillStyle=color(px,py);g.fillRect(col,z,4,top-z+1);top=z}}}hud.textContent='X: '+x.toFixed(1)+' m | Y: '+y.toFixed(1)+' m | Magasság: '+height(x,y).toFixed(1)+' m';const near=buildings().filter(b=>Math.hypot(b.x-x,b.y-y)<150);hud.textContent+=' | Közelben: '+near.map(b=>b.name).join(', ');g.fillStyle='#fff';g.fillRect(W/2-5,H/2,10,1);g.fillRect(W/2,H/2-5,1,10);requestAnimationFrame(frame)}era.onchange=()=>{if(!safe(x,y))reset()};requestAnimationFrame(frame);
</script></html>
