<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoRender</title><style>body{margin:0;background:#101b24;color:white;font:15px system-ui}#view{height:72vh;position:relative}canvas{display:block;width:100%;height:100%}header{display:flex;gap:10px;flex-wrap:wrap;padding:10px}button,select{padding:8px}a{color:#8ce4ff}#hud{padding:10px}#cross{position:absolute;top:50%;left:50%;pointer-events:none}</style><header><a href="index.html">Főoldal</a><a href="terrain.html">Régi terep</a><select id="era" hidden><option>Kr. e. 9000</option><option>1435</option><option>1885</option><option selected>2032</option></select><button id="tag3">Időhorgony (H)</button><button id="device">Időgép (T)</button><button id="full">Teljes képernyő</button><button id="weather">Időjárás</button><button id="night">Nappal / éjjel</button></header><div id="view"><span id="cross">+</span><div id="flash" style="position:absolute;inset:0;background:#b8efff;opacity:0;pointer-events:none;transition:opacity .35s"></div><dialog id="chronoDevice" style="background:#142635;color:white;border:1px solid #79d8ff;border-radius:12px;max-width:90vw"><h2>ChronoNavigation</h2><label>Fejlesztési szint <select id="tier"><option>Mk0</option><option>Mk1</option><option>Mk2</option><option>Mk3</option></select></label><p><label>Célév <input id="targetYear" type="number" value="2002" step="0.01"></label></p><p><label>Cél X (m) <input id="targetX" type="number" value="0"></label> <label>Cél Z (m) <input id="targetZ" type="number" value="0"></label></p><p><label>Időhorgony <select id="anchor3"><option value="">Szabad célzás</option></select></label></p><button id="jump3">Időugrás</button> <button id="wait3">8 óra várakozás</button> <button id="close3">Bezárás</button><p id="deviceStatus"></p><small>Helyi, szintetikus 4 × 4 km-es világ; a korszakmodellek közelítőek.</small></dialog><div id="lens" style="position:absolute;left:12px;top:12px;background:#10202bcc;padding:12px;border:1px solid #78c9e8;pointer-events:none"></div><div id="talk" style="position:absolute;bottom:20px;left:12px;background:#10202bcc;padding:10px;pointer-events:none"></div></div><div id="hud">3D motor betöltése… Ha nem indul, használd a régi terepet.</div><header>WASD: mozgás · egér: körülnézés · kattintás: egér rögzítése · Esc: kilépés · E: beszélgetés a közelben</header><script type="module">
import * as T from './vendor/three/three.module.min.js';
const $=id=>document.getElementById(id),view=$('view'),scene=new T.Scene(),camera=new T.PerspectiveCamera(70,1,.1,2500),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;view.prepend(renderer.domElement);scene.background=new T.Color(0xaacde3);scene.fog=new T.FogExp2(0xaacde3,.0012);
const ambient=new T.HemisphereLight(0xcce5ff,0x6b6247,2);scene.add(ambient);const sun=new T.DirectionalLight(0xffe4b7,2.5);sun.position.set(100,150,70);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-120,right:120,top:120,bottom:-120,far:500});sun.shadow.mapSize.set(1024,1024);scene.add(sun,sun.target);
const world=new T.Group();scene.add(world);let obstacles=[],people=[],yaw=0,pitch=0,night=false,keys=new Set(),x=0,z=0;

function box(w,h,d,color,x,y,z){return mesh(new T.BoxGeometry(w,h,d),color,x,y,z)}
function house(x,z,w,d,h,wall,roof,modern=false){const y=height(x,z);box(w,h,d,wall,x,y+h/2,z);if(modern)box(w+.5,.5,d+.5,roof,x,y+h+.25,z);else{const s=new T.Shape();s.moveTo(-w/2-.4,0);s.lineTo(w/2+.4,0);s.lineTo(0,h*.45);s.closePath();const g=new T.ExtrudeGeometry(s,{depth:d+.8,bevelEnabled:false});g.translate(0,0,-(d+.8)/2);mesh(g,roof,x,y+h,z)}box(1.3,2.2,.12,0x59432e,x,y+1.1,z+d/2+.07);for(const dx of [-w*.3,w*.3])box(1.2,1.3,.13,0x7298aa,x+dx,y+h*.6,z+d/2+.08);obstacles.push({x,z,w,d})}
function rebuild(){for(const m of [...world.children]){m.traverse(q=>{if(q.isMesh){q.geometry.dispose();q.material.dispose()}});world.remove(m)}obstacles=[];people=[];const e=$('era').selectedIndex;const g=new T.PlaneGeometry(4000,4000,160,160);g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,height(p.getX(i),p.getZ(i)));g.computeVertexNormals();const ground=mesh(g,0x789451,0,0,0);ground.castShadow=false;

for(let i=0;i<(e===0?4:12);i++){let hx=18+i%6*18,hz=(i<6?-1:1)*18;house(hx,hz,e===0?5:10,7,e===0?2.5:5,e===0?0x94734e:e===3?0xd5d5cf:0xc5ad88,e===3?0x454e55:0x78513a,e===3)}

for(let i=0;i<8;i++){const m=new T.Group();world.add(m);const part=(geo,col,px,py,pz)=>{const q=new T.Mesh(geo,new T.MeshStandardMaterial({color:col}));q.position.set(px,py,pz);q.castShadow=true;m.add(q);return q};const cloth=e===3?0x426c93:0x806344;part(new T.BoxGeometry(.44,.62,.25),cloth,0,1.12,0);part(new T.SphereGeometry(.15,12,8),0xc99b78,0,1.65,0);for(const side of [-1,1]){part(new T.BoxGeometry(.15,.65,.17),0x49423a,side*.13,.35,0);part(new T.BoxGeometry(.13,.55,.15),cloth,side*.3,1.1,0)}m.userData.name=['Áron','Anna','Márton','Éva','Péter','Júlia','Dániel','Sára'][i];people.push(m)}x=0;z=0;}
function safe(nx,nz){return Math.abs(nx)<1980&&Math.abs(nz)<1980&&!obstacles.some(b=>Math.abs(nx-b.x)<b.w/2+.5&&Math.abs(nz-b.z)<b.d/2+.5)}
$('era').onchange=rebuild;$('night').onclick=()=>{night=!night;scene.background.set(night?0x101b35:0xaacde3);scene.fog.color.copy(scene.background);ambient.intensity=night?.35:2;sun.intensity=night?.12:2.5};$('full').onclick=()=>view.requestFullscreen().catch(e=>$('hud').textContent=e.message);renderer.domElement.onclick=()=>renderer.domElement.requestPointerLock();document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.002;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.002))}});addEventListener('keydown',e=>{if(['w','a','s','d'].includes(e.key.toLowerCase()))keys.add(e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement)keys.clear()});new ResizeObserver(()=>{renderer.setSize(view.clientWidth,view.clientHeight,false);camera.aspect=view.clientWidth/Math.max(1,view.clientHeight);camera.updateProjectionMatrix()}).observe(view);rebuild();let weather=0,clock=12,autoDay=true,dialogUntil=0;const skies=[0xaacde3,0x9da8ae,0x687b88];function lighting(){const daylight=Math.max(.08,Math.sin((clock-6)*Math.PI/12));scene.background.set(daylight<.15?0x101b35:skies[weather]);scene.fog.color.copy(scene.background);scene.fog.density=[.0012,.004,.012][weather];ambient.intensity=.25+daylight*1.75;sun.intensity=daylight*2.5*(weather===2?.35:1);sun.position.set(Math.cos(clock*Math.PI/12)*120,Math.max(5,daylight*150),70)}$("weather").onclick=()=>{weather=(weather+1)%3;lighting()};$("night").onclick=()=>{clock=clock>=6&&clock<18?0:12;lighting()};function nearest(){return people.map(m=>({m,d:Math.hypot(m.position.x-x,m.position.z-z)})).sort((a,b)=>a.d-b.d)[0]}addEventListener("keydown",e=>{if(e.key.toLowerCase()==="e"&&!e.repeat){const n=nearest();if(n&&n.d<3){$("talk").textContent=n.m.userData.name+": Jó napot!";dialogUntil=performance.now()+5000}}});const tiers3=[[30,200,2,20],[35,300,1.5,10],[42,400,.8,3],[50,500,.2,.25]];const saveKey="chronoverse.render.navigation.v1";let nav={year:2032,charge:1,jumps:0,tier:0};try{const v=JSON.parse(localStorage.getItem(saveKey)||"null");if(v&&Number.isFinite(v.year)&&Number.isFinite(v.charge)&&Number.isInteger(v.jumps)&&tiers3[v.tier]){nav={year:v.year,charge:Math.max(0,Math.min(1,v.charge)),jumps:Math.max(0,v.jumps),tier:v.tier};$("era").selectedIndex=epoch(nav.year);rebuild();if(Number.isFinite(v.x)&&Number.isFinite(v.z)&&safe(v.x,v.z)){x=v.x;z=v.z}}}catch(e){}function epoch(y){return y<1000?0:y<1750?1:y<1950?2:3}function persist(){try{localStorage.setItem(saveKey,JSON.stringify({...nav,x,z}))}catch(e){$("deviceStatus").textContent="Mentés sikertelen: "+e.message}}function status3(msg=""){$("deviceStatus").textContent=msg+" | "+nav.year.toFixed(2)+" | "+Math.round(nav.charge*100)+"% | "+nav.jumps+" ugrás"}function openDevice(){refreshAnchors();if(document.pointerLockElement)document.exitPointerLock();keys.clear();$("tier").selectedIndex=nav.tier;$("targetYear").value=(nav.year-10).toFixed(2);$("targetX").value=Math.round(x);$("targetZ").value=Math.round(z);status3();if(!$("chronoDevice").open)$("chronoDevice").showModal()}$("device").onclick=openDevice;$("close3").onclick=()=>$("chronoDevice").close();addEventListener("keydown",e=>{if(e.key.toLowerCase()==="t"&&!e.repeat&&!$("chronoDevice").open)openDevice()});$("tier").onchange=()=>{nav.tier=$("tier").selectedIndex;persist();status3()};$("wait3").onclick=()=>{nav.charge=Math.min(1,nav.charge+8/24);nav.year+=8/8765.82;clock=(clock+8)%24;persist();status3("8 óra eltelt")};$("jump3").onclick=()=>{const [years,km,te,se]=tiers3[nav.tier];let ty=Number($("targetYear").value);if(Number.isFinite(ty)&&Math.abs(ty-nav.year)>years&&Math.abs(ty-nav.year)<=years+1)ty=nav.year+Math.sign(ty-nav.year)*years;const tx=Number($("targetX").value),tz=Number($("targetZ").value),dy=Math.abs(ty-nav.year),dist=Math.hypot(tx-x,tz-z);if(![ty,tx,tz].every(Number.isFinite)||dy===0||dy>years||dist>km*1000||Math.abs(tx)>=1980||Math.abs(tz)>=1980||dy/years>nav.charge+1e-9){status3("Érvénytelen cél vagy elégtelen energia");return}const anchor=anchors.find(a=>a.id===$("anchor3").value);if(anchor&&(ty<anchor.year||!anchorExists(anchor,ty)||tx!==anchor.x||tz!==anchor.z)){status3("Érvénytelen horgonycél");return}const factor=Math.max(.004,1-nav.jumps/25),old={x,z,e:$("era").selectedIndex};let arrival=ty+(Math.random()*2-1)*te*factor; arrival=Math.min(nav.year+years,Math.max(nav.year-years,arrival));if(anchor&&(arrival<anchor.year||!anchorExists(anchor,arrival))){status3("A horgony az érkezési időben nem létezik");return}const angle=Math.random()*Math.PI*2,err=Math.sqrt(Math.random())*se*1000*factor*(anchor ? .05 : 1),ax=tx+Math.cos(angle)*err,az=tz+Math.sin(angle)*err;$("era").selectedIndex=epoch(arrival);rebuild();let landing=null;for(let radius=0;radius<=150&&!landing;radius+=10){for(let i=0;i<16;i++){const px=ax+radius*Math.cos(i*Math.PI/8),pz=az+radius*Math.sin(i*Math.PI/8);if(safe(px,pz)&&Math.hypot(px-old.x,pz-old.z)<=km*1000){landing=[px,pz];break}}}if(!landing){$("era").selectedIndex=old.e;rebuild();x=old.x;z=old.z;status3("Nincs biztonságos helyi érkezés; energia megmaradt");return} [x,z]=landing;nav.year=arrival;nav.charge=Math.max(0,nav.charge-dy/years);nav.jumps++;persist();status3("Sikeres ugrás");$("chronoDevice").close();$("flash").style.opacity=1;setTimeout(()=>$("flash").style.opacity=0,400)};const anchorKey="chronoverse.render.anchors.v1";let anchors=[];try{const a=JSON.parse(localStorage.getItem(anchorKey)||"[]");if(Array.isArray(a))anchors=a.filter(v=>v.id==="church"&&Number.isFinite(v.year)&&v.x===65&&v.z===-28)}catch(e){}function anchorExists(a,y){return a.id==="church"&&y>=1000}function nearChurch(){return epoch(nav.year)>0&&Math.hypot(Math.max(0,Math.abs(x-65)-7),Math.max(0,Math.abs(z+42)-12))<=2}function tag(){if($("chronoDevice").open)return;if(!nearChurch()){ $("talk").textContent="Érintsd meg a templom külső falát (2 m).";dialogUntil=performance.now()+5000;return}if(!anchors.some(a=>a.id==="church")){anchors.push({id:"church",year:nav.year,x:65,z:-28});try{localStorage.setItem(anchorKey,JSON.stringify(anchors))}catch(e){anchors.pop();$("talk").textContent="A horgony mentése sikertelen.";dialogUntil=performance.now()+5000;return}}$("talk").textContent="Templom: időhorgony rögzítve.";dialogUntil=performance.now()+5000}function refreshAnchors(){const s=$("anchor3");s.replaceChildren(new Option("Szabad célzás",""));for(const a of anchors)s.add(new Option("Templom – "+a.year.toFixed(2),a.id))} $("anchor3").onchange=()=>{const a=anchors.find(a=>a.id===$("anchor3").value);if(a){$("targetX").value=a.x;$("targetZ").value=a.z;$("targetYear").value=Math.max(a.year,nav.year+1).toFixed(2)}};$("tag3").onclick=tag;addEventListener("keydown",e=>{if(e.key.toLowerCase()==="h"&&!e.repeat&&!$("chronoDevice").open)tag()});const marker=new T.Mesh(new T.OctahedronGeometry(.65),new T.MeshBasicMaterial({color:0x55eaff}));scene.add(marker);let last=performance.now(),saveElapsed=0;renderer.setAnimationLoop(now=>{let dt=Math.min(.05,(now-last)/1000);last=now;let f=Number(keys.has('w'))-Number(keys.has('s')),r=Number(keys.has('d'))-Number(keys.has('a')),scale=5*dt/Math.max(1,Math.hypot(f,r)),nx=x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*scale,nz=z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*scale;if(!$('chronoDevice').open){if(safe(nx,z))x=nx;if(safe(x,nz))z=nz;}camera.position.set(x,height(x,z)+1.7,z);camera.rotation.set(pitch,yaw,0,'YXZ');people.forEach((m,i)=>{let px=20+i*9+Math.sin(now*.0004+i)*5,pz=3*Math.cos(now*.0005+i);m.position.set(px,height(px,pz),pz)});$('hud').textContent=$('era').value+' | '+x.toFixed(1)+' m, '+z.toFixed(1)+' m | '+(night?'Éjszaka':'Nappal')+' | Szintetikus 3D próbatér';if(!$("chronoDevice").open){clock=(clock+dt/60)%24;nav.charge=Math.min(1,nav.charge+dt/1440);nav.year+=dt/(60*8765.82);saveElapsed+=dt;if(saveElapsed>5){persist();saveElapsed=0}}lighting();const n=nearest();$("lens").textContent=nav.year.toFixed(2)+" | "+Math.round(nav.charge*100)+"% | "+$("era").value+" | "+String(Math.floor(clock)).padStart(2,"0")+":"+String(Math.floor(clock%1*60)).padStart(2,"0")+" | "+["Derült","Borult","Köd"][weather];if(now>dialogUntil)$("talk").textContent=n&&n.d<3?"E – Beszélgetés: "+n.m.userData.name:"";const active=anchors.find(a=>nav.year>=a.year&&anchorExists(a,nav.year));marker.visible=!!active;if(active){marker.position.set(65,height(65,-42)+19,-42);marker.rotation.y+=dt}if(now>dialogUntil&&nearChurch())$("talk").textContent="H – időhorgony rögzítése";renderer.render(scene,camera)});
</script></html>
