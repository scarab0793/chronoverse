<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoRender</title><style>body{margin:0;background:#101b24;color:white;font:15px system-ui}#view{height:72vh;position:relative}canvas{display:block;width:100%;height:100%}header{display:flex;gap:10px;flex-wrap:wrap;padding:10px}button,select{padding:8px}a{color:#8ce4ff}#hud{padding:10px}#cross{position:absolute;top:50%;left:50%;pointer-events:none}</style><header><a href="index.html">Főoldal</a><a href="terrain.html">Régi terep</a><select id="era"><option>Kr. e. 9000</option><option>1435</option><option>1885</option><option selected>2032</option></select><button id="full">Teljes képernyő</button><button id="night">Nappal / éjjel</button></header><div id="view"><span id="cross">+</span></div><div id="hud">3D motor betöltése… Ha nem indul, használd a régi terepet.</div><header>WASD: mozgás · egér: körülnézés · kattintás: egér rögzítése · Esc: kilépés</header><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const $=id=>document.getElementById(id),view=$('view'),scene=new T.Scene(),camera=new T.PerspectiveCamera(70,1,.1,2500),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;view.prepend(renderer.domElement);scene.background=new T.Color(0xaacde3);scene.fog=new T.FogExp2(0xaacde3,.0012);
const ambient=new T.HemisphereLight(0xcce5ff,0x6b6247,2);scene.add(ambient);const sun=new T.DirectionalLight(0xffe4b7,2.5);sun.position.set(100,150,70);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-120,right:120,top:120,bottom:-120,far:500});sun.shadow.mapSize.set(1024,1024);scene.add(sun,sun.target);
const world=new T.Group();scene.add(world);let obstacles=[],people=[],yaw=0,pitch=0,night=false,keys=new Set(),x=0,z=0;
const height=(x,z)=>3*Math.sin(x/65)*Math.sin(z/85);
function mesh(geo,color,x,y,z){const m=new T.Mesh(geo,new T.MeshStandardMaterial({color}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;world.add(m);return m}
function box(w,h,d,color,x,y,z){return mesh(new T.BoxGeometry(w,h,d),color,x,y,z)}
function house(x,z,w,d,h,wall,roof,modern=false){const y=height(x,z);box(w,h,d,wall,x,y+h/2,z);if(modern)box(w+.5,.5,d+.5,roof,x,y+h+.25,z);else{const s=new T.Shape();s.moveTo(-w/2-.4,0);s.lineTo(w/2+.4,0);s.lineTo(0,h*.45);s.closePath();const g=new T.ExtrudeGeometry(s,{depth:d+.8,bevelEnabled:false});g.translate(0,0,-(d+.8)/2);mesh(g,roof,x,y+h,z)}box(1.3,2.2,.12,0x59432e,x,y+1.1,z+d/2+.07);for(const dx of [-w*.3,w*.3])box(1.2,1.3,.13,0x7298aa,x+dx,y+h*.6,z+d/2+.08);obstacles.push({x,z,w,d})}
function rebuild(){for(const m of [...world.children]){m.geometry.dispose();m.material.dispose();world.remove(m)}obstacles=[];people=[];const e=$('era').selectedIndex;const g=new T.PlaneGeometry(4000,4000,160,160);g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,height(p.getX(i),p.getZ(i)));g.computeVertexNormals();const ground=mesh(g,0x789451,0,0,0);ground.castShadow=false;
if(e>0)box(300,.08,7,e===3?0x555b60:0xb39b72,0,.1,0);
for(let i=0;i<95;i++){const tx=Math.sin(i*71.7)*260,tz=Math.cos(i*43.1)*260;if(Math.abs(tz)<18||Math.hypot(tx,tz)<35)continue;const y=height(tx,tz);mesh(new T.CylinderGeometry(.35,.55,5,7),0x715137,tx,y+2.5,tz);mesh(new T.ConeGeometry(3.2,8,8),0x365e32,tx,y+7,tz);obstacles.push({x:tx,z:tz,w:1.2,d:1.2})}
for(let i=0;i<(e===0?4:12);i++){let hx=18+i%6*18,hz=(i<6?-1:1)*18;house(hx,hz,e===0?5:10,7,e===0?2.5:5,e===0?0x94734e:e===3?0xd5d5cf:0xc5ad88,e===3?0x454e55:0x78513a,e===3)}
if(e>0){house(65,-42,14,24,9,0xaaa69b,0x55524c);box(5,17,5,0xaaa69b,65,height(65,-54)+8.5,-54);obstacles.push({x:65,z:-54,w:5,d:5})}
if(e>1)house(100,35,22,15,8,0xa65f48,0x494747,true);
for(let i=0;i<8;i++){const m=mesh(new T.CapsuleGeometry(.28,1,4,8),e===3?0x426c93:0x806344,0,0,0);people.push(m)}x=0;z=0;}
function safe(nx,nz){return Math.abs(nx)<1980&&Math.abs(nz)<1980&&!obstacles.some(b=>Math.abs(nx-b.x)<b.w/2+.5&&Math.abs(nz-b.z)<b.d/2+.5)}
$('era').onchange=rebuild;$('night').onclick=()=>{night=!night;scene.background.set(night?0x101b35:0xaacde3);scene.fog.color.copy(scene.background);ambient.intensity=night?.35:2;sun.intensity=night?.12:2.5};$('full').onclick=()=>view.requestFullscreen().catch(e=>$('hud').textContent=e.message);renderer.domElement.onclick=()=>renderer.domElement.requestPointerLock();document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.002;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.002))}});addEventListener('keydown',e=>{if(['w','a','s','d'].includes(e.key.toLowerCase()))keys.add(e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement)keys.clear()});new ResizeObserver(()=>{renderer.setSize(view.clientWidth,view.clientHeight,false);camera.aspect=view.clientWidth/Math.max(1,view.clientHeight);camera.updateProjectionMatrix()}).observe(view);rebuild();let last=performance.now();renderer.setAnimationLoop(now=>{let dt=Math.min(.05,(now-last)/1000);last=now;let f=Number(keys.has('w'))-Number(keys.has('s')),r=Number(keys.has('d'))-Number(keys.has('a')),scale=5*dt/Math.max(1,Math.hypot(f,r)),nx=x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*scale,nz=z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*scale;if(safe(nx,z))x=nx;if(safe(x,nz))z=nz;camera.position.set(x,height(x,z)+1.7,z);camera.rotation.set(pitch,yaw,0,'YXZ');people.forEach((m,i)=>{let px=20+i*9+Math.sin(now*.0004+i)*5,pz=3*Math.cos(now*.0005+i);m.position.set(px,height(px,pz)+.8,pz)});$('hud').textContent=$('era').value+' | '+x.toFixed(1)+' m, '+z.toFixed(1)+' m | '+(night?'Éjszaka':'Nappal')+' | Szintetikus 3D próbatér';renderer.render(scene,camera)});
</script></html>
